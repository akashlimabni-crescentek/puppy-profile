name: CI

# Runs the full quality gate on every push and PR to main.
# Demonstrates the "communication cadence / production readiness" axis:
# nothing merges unless type-check, lint, tests, and the production build pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook
